# NeonFX — Fish syntax highlighting
# Installed to ~/.config/fish/conf.d/omarchy-theme.fish on theme set

set --global fish_color_normal 00f5ff --bold
set --global fish_color_command ff0099 --bold
set --global fish_color_param ff66cc --bold
set --global fish_color_keyword 66faff --bold
set --global fish_color_quote 00ff9f --bold
set --global fish_color_redirection ff33aa --bold
set --global fish_color_end ff0099 --bold
set --global fish_color_operator ff66cc --bold
set --global fish_color_escape 66faff --bold
set --global fish_color_cwd 33ffb8 --bold
set --global fish_color_cwd_root ff3366 --bold
set --global fish_color_error ff3366 --bold
set --global fish_color_match ff33aa --bold
set --global fish_color_autosuggestion 5a3a88
set --global fish_color_comment 7a6a98
set --global fish_color_option 00f5ff --bold
set --global fish_color_selection --background=ff0099
set --global fish_color_search_match --background=ff33aa

# bat — NeonFX syntax theme (see bat/NeonFX.tmTheme)
set --global BAT_THEME 'NeonFX'
set --global BAT_STYLE plain
set --global PAGER bat --paging-always --plain

# cat cannot syntax-highlight — route file args through bat instead
function cat
    if not isatty stdout
        command cat $argv
        return $status
    end

    if test (count $argv) -eq 0
        command cat
        return $status
    end

    for arg in $argv
        if string match -q -- '-*' $arg
            command cat $argv
            return $status
        end
    end

    bat --color=always --style=plain --paging=never --theme="$BAT_THEME" $argv
end

