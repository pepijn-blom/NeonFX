# NeonFX — Bash bat + cat routing
# Installed to ~/.config/omarchy/theme.bash on theme set

_theme_dir="$(dirname "$(readlink -f "${BASH_SOURCE[0]}")")"
# shellcheck source=/dev/null
source "$_theme_dir/cli.env.sh"

export BAT_THEME='NeonFX'
export BAT_STYLE=plain
export PAGER='bat --paging=always --plain'

cat() {
  if [[ ! -t 1 ]]; then
    command cat "$@"
    return
  fi

  if [[ $# -eq 0 ]]; then
    command cat
    return
  fi

  for arg in "$@"; do
    if [[ $arg == -* ]]; then
      command cat "$@"
      return
    fi
  done

  bat --color=always --style=plain --paging=never --theme="$BAT_THEME" "$@"
}
