# NeonFX — git CLI colors (truecolor hex, Git 2.12+)
# Hex values must be quoted — bare # starts a comment in gitconfig.

[color]
	ui = true
	branch = auto
	diff = auto
	interactive = auto

[color "status"]
	header = "bold #00f5ff"
	branch = "bold #00f5ff"
	nobranch = "bold #ff3366"
	added = "#33ffb8"
	changed = "#ff33aa"
	untracked = "#ff33aa"
	renamed = "#66faff"
	ignored = "#7a6a98"

[color "branch"]
	current = "bold #00f5ff"
	local = "#66faff"
	remote = "#ff33aa"
	upstream = "#33ffb8"
	plain = "#00f5ff"

[color "diff"]
	context = "#7a6a98"
	meta = "bold #5a3a88"
	frag = "#5a3a88"
	old = "#ff3366"
	new = "#33ffb8"
	oldMoved = "#ff33aa"
	newMoved = "#00f5ff"
	contextBold = "bold #00f5ff"
	oldBold = "bold #ff3366"
	newBold = "bold #33ffb8"

[color "grep"]
	match = "bold #ff0099"
	matchContext = "#00f5ff"
	matchSelected = "bold #ff33aa"
	filename = "#00f5ff"
	function = "#66faff"
	context = "#7a6a98"
	lineNumber = "#5a3a88"

[color "log"]
	commit = "#00f5ff"
	date = "#7a6a98"
	author = "#66faff"
	ref = "#00f5ff"

[color "decorate"]
	HEAD = "bold #ff0099"
	branch = "#00f5ff"
	tag = "#ff33aa"
	remoteBranch = "#66faff"
	stash = "#66faff"
	grafted = "#7a6a98"

[color "remote"]
	origin = "#00f5ff"

[color "ui"]
	red = "#ff3366"
	green = "#33ffb8"
	yellow = "#ff33aa"
	blue = "#5eb3ff"
	magenta = "#ff0099"
	cyan = "#00f5ff"
